<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8E8D6">
  <meta name="color-scheme" content="light dark">
  <meta
    name="description"
    content="Blackout al Faro: esperienza digitale completa per giocare insieme su un solo dispositivo."
  >
  <title>Blackout al Faro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="brand" aria-label="Blackout al Faro">
        <span class="brand__mark" aria-hidden="true">
          <span class="brand__beam"></span>
          <span class="brand__tower"></span>
        </span>
        <span class="brand__text">
          <span class="brand__eyebrow">Port Leon</span>
          <span class="brand__title">Blackout al Faro</span>
        </span>
      </div>

      <div class="audio-toolbar" role="group" aria-label="Controlli audio">
        <label class="sr-only" for="audio-mode">Modalità audio</label>
        <select id="audio-mode" class="audio-toolbar__mode" data-audio-mode>
          <option value="muted">Muto</option>
          <option value="voice">Voce</option>
          <option value="voice-ambience">Voce e atmosfera</option>
        </select>
        <button
          id="audio-toggle"
          class="icon-button"
          type="button"
          data-action="toggle-audio"
          aria-label="Attiva o disattiva l'audio"
          aria-pressed="false"
          title="Attiva o disattiva l'audio"
        >
          <span aria-hidden="true">♪</span>
        </button>
        <button
          id="audio-repeat"
          class="icon-button"
          type="button"
          data-action="repeat-narration"
          aria-label="Ripeti l'ultima frase"
          title="Ripeti l'ultima frase"
        >
          <span aria-hidden="true">↻</span>
        </button>
      </div>
    </header>

    <main id="app" class="app-main" tabindex="-1">
      <div class="app-loading" role="status">
        <span class="app-loading__light" aria-hidden="true"></span>
        <span>Preparazione della baia…</span>
      </div>
    </main>
  </div>

  <div
    id="privacy-cover"
    class="privacy-cover"
    role="dialog"
    aria-modal="true"
    aria-labelledby="privacy-title"
    hidden
  >
    <div class="privacy-cover__content">
      <span class="privacy-cover__icon" aria-hidden="true">◉</span>
      <p class="eyebrow">Schermata protetta</p>
      <h2 id="privacy-title">Il mare nasconde i suoi segreti</h2>
      <p>Passa il dispositivo alla persona chiamata prima di continuare.</p>
      <button class="button button--primary button--wide" type="button" data-action="resume-private-screen">
        Sono pronto
      </button>
    </div>
  </div>

  <div
    id="public-announcer"
    class="sr-only"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <noscript>
    <div class="noscript">
      Blackout al Faro richiede JavaScript per distribuire i ruoli e guidare la partita.
    </div>
  </noscript>

  <script src="game-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
