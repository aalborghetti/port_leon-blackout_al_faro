<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="../">
  <title>Blackout al Faro — Browser smoke test</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #test-result {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      padding: 0.5rem;
      background: white;
      color: black;
      font: 700 14px/1.2 monospace;
    }
  </style>
</head>
<body>
  <select id="audio-mode">
    <option value="muted">Muto</option>
    <option value="voice">Voce</option>
    <option value="voice-ambience">Voce e atmosfera</option>
  </select>
  <button id="audio-toggle"></button>
  <button id="audio-repeat"></button>
  <main id="app" class="app-main"></main>
  <div id="privacy-cover" hidden>
    <p class="eyebrow"></p>
    <h2></h2>
    <p></p>
    <button type="button" data-action="resume-private-screen">Riprendi</button>
  </div>
  <div id="public-announcer"></div>
  <output id="test-result">RUNNING</output>

  <script>
    window.addEventListener("error", function (event) {
      const result = document.getElementById("test-result");
      result.value = `FAIL BOOT: ${event.message}`;
      result.textContent = `FAIL BOOT: ${event.message}`;
    });
    window.addEventListener("unhandledrejection", function (event) {
      const result = document.getElementById("test-result");
      const message = event.reason?.message || String(event.reason);
      result.value = `FAIL PROMISE: ${message}`;
      result.textContent = `FAIL PROMISE: ${message}`;
    });
  </script>
  <script>
    (function () {
      "use strict";

      window.__BLACKOUT_STORAGE_KEY__ =
        "blackout-al-faro:partita:browser-smoke:v3";
      window.__BLACKOUT_SMOKE_RELOAD_KEY__ =
        `${window.__BLACKOUT_STORAGE_KEY__}:reload`;
      window.__BLACKOUT_SMOKE_RESUMING__ =
        localStorage.getItem(window.__BLACKOUT_SMOKE_RELOAD_KEY__) === "1";
      window.__BLACKOUT_SMOKE_REAL_TIMINGS__ =
        new URLSearchParams(location.search).has("real-timing");
      if (!window.__BLACKOUT_SMOKE_REAL_TIMINGS__) {
        window.__BLACKOUT_TEST_TIMINGS__ = {
          handoff: 80,
          nightTransition: 120
        };
      }
      if (window.__BLACKOUT_SMOKE_RESUMING__) {
        localStorage.removeItem(window.__BLACKOUT_SMOKE_RELOAD_KEY__);
      } else {
        localStorage.removeItem(window.__BLACKOUT_STORAGE_KEY__);
        localStorage.removeItem(window.__BLACKOUT_SMOKE_RELOAD_KEY__);
      }

      let activeUtterance = null;
      const speech = {
        failNext: false,
        spokenTexts: [],
        cancel() {
          const cancelled = activeUtterance;
          activeUtterance = null;
          if (cancelled) {
            setTimeout(() => cancelled.onerror?.({ error: "canceled" }), 0);
          }
        },
        getVoices() {
          return [];
        },
        speak(utterance) {
          activeUtterance = utterance;
          this.spokenTexts.push(utterance.text);
          const shouldFail = this.failNext;
          this.failNext = false;
          setTimeout(() => {
            if (activeUtterance !== utterance) return;
            activeUtterance = null;
            if (shouldFail) utterance.onerror?.({ error: "synthesis-failed" });
            else utterance.onend?.();
          }, 20);
        }
      };
      window.__BLACKOUT_TEST_SPEECH__ = speech;

      if (!window.SpeechSynthesisUtterance) {
        window.SpeechSynthesisUtterance = function (text) {
          this.text = text;
        };
      }
      Object.defineProperty(window, "speechSynthesis", {
        configurable: true,
        value: speech
      });
    })();
  </script>
  <script src="game-engine.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      "use strict";

      const result = document.getElementById("test-result");
      const app = document.getElementById("app");
      const transitionWait = window.__BLACKOUT_SMOKE_REAL_TIMINGS__ ? 5300 : 180;
      const handoffWait = window.__BLACKOUT_SMOKE_REAL_TIMINGS__ ? 3000 : 120;

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      function click(action) {
        const button = app.querySelector(`[data-action="${action}"]`);
        assert(button, `Azione non trovata: ${action}`);
        button.click();
      }

      function nextFrame() {
        return new Promise((resolve) => {
          let completed = false;
          const finish = () => {
            if (completed) return;
            completed = true;
            resolve();
          };
          requestAnimationFrame(() => requestAnimationFrame(finish));
          setTimeout(finish, 50);
        });
      }

      function delay(milliseconds) {
        return new Promise((resolve) => setTimeout(resolve, milliseconds));
      }

      function report(status) {
        const port = new URLSearchParams(window.location.search).get("report");
        if (!/^\d{2,5}$/.test(port || "")) return;
        const beacon = new Image();
        beacon.src = `http://127.0.0.1:${port}/${encodeURIComponent(status)}?t=${Date.now()}`;
      }

      async function completeDayAfterReload() {
        assert(app.textContent.includes("Giorno 1"), "Giorno 1 non ripristinato");
        assert(
          app.textContent.includes("Voto doppio attivo"),
          "Voto doppio del Portavoce perso dopo il reload"
        );
        assert(
          app.querySelector('input[name="day-target"]') &&
          !app.querySelector('[data-action="day-elimination"]'),
          "Il giorno non apre direttamente la scelta dell'eliminato"
        );

        const dayTargets = Array.from(app.querySelectorAll('input[name="day-target"]'));
        const lastDayTarget = dayTargets.at(-1);
        const lastDayOption = lastDayTarget?.closest(".target-option");
        const dayActionBar = app.querySelector(".action-bar");
        assert(lastDayOption && dayActionBar, "Lista diurna incompleta");
        window.scrollTo(0, document.documentElement.scrollHeight);
        await delay(40);
        const lastBounds = lastDayOption.getBoundingClientRect();
        const actionBounds = dayActionBar.getBoundingClientRect();
        const lastHit = document.elementFromPoint(
          lastBounds.left + lastBounds.width / 2,
          lastBounds.top + lastBounds.height / 2
        );
        assert(
          lastBounds.bottom <= actionBounds.top && lastDayOption.contains(lastHit),
          "L'ultimo giocatore diurno non è visibile o selezionabile"
        );

        lastDayTarget.checked = true;
        click("day-target-review");
        await nextFrame();
        assert(
          app.querySelector('[data-action="day-target-confirm"]') &&
          !app.querySelector('[data-action="day-target-back"]'),
          "La conferma mostra ancora il pulsante Cambia nome"
        );
        click("day-target-confirm");
        await nextFrame();
        assert(app.textContent.includes("Ruolo rivelato"), "Rivelazione eliminato assente");

        click("elimination-continue");
        await delay(60);
        assert(app.textContent.includes("Notte 2"), "La Notte 2 non è iniziata dopo il Giorno 1");

        localStorage.removeItem(window.__BLACKOUT_STORAGE_KEY__);
        localStorage.removeItem(window.__BLACKOUT_SMOKE_RELOAD_KEY__);
        result.value = "PASS";
        result.textContent = "PASS";
        document.documentElement.dataset.testStatus = "pass";
        report("PASS");
      }

      async function run() {
        if (window.__BLACKOUT_SMOKE_RESUMING__) {
          assert(
            app.querySelector('[data-action="continue-game"]'),
            "Partita salvata non disponibile dopo il reload"
          );
          click("continue-game");
          await nextFrame();
          await completeDayAfterReload();
          return;
        }

        assert(app.textContent.includes("Blackout al Faro"), "Benvenuto assente");

        click("new-game");
        await nextFrame();
        assert(app.textContent.includes("Prepara l'equipaggio"), "Setup assente");

        const sentinella = app.querySelector(
          'input[data-field="setup-special"][value="sentinella"]'
        );
        sentinella.checked = false;
        sentinella.dispatchEvent(new Event("change", { bubbles: true }));
        await nextFrame();
        const portavoce = app.querySelector(
          'input[data-field="setup-special"][value="portavoce"]'
        );
        portavoce.checked = true;
        portavoce.dispatchEvent(new Event("change", { bubbles: true }));
        await nextFrame();
        const muted = app.querySelector(
          'input[data-field="setup-audio"][value="muted"]'
        );
        muted.checked = true;
        muted.dispatchEvent(new Event("change", { bubbles: true }));
        await nextFrame();
        assert(
          !app.querySelector('[data-action="start-assignment"]').disabled,
          "Setup Portavoce/Guastatore non valido"
        );

        click("start-assignment");
        await nextFrame();
        assert(app.textContent.includes("Tieni premuta"), "Passaggio dispositivo assente");
        assert(
          app.querySelector(".action-bar")?.classList.contains("action-bar--inline"),
          "Annulla assegnazione non è nel flusso della pagina"
        );

        let portavoceIndex = -1;
        for (let index = 0; index < 8; index += 1) {
          const revealControl = app.querySelector('[data-action="hold-reveal"]');
          assert(revealControl, `Controllo di rivelazione ${index + 1} assente`);
          if (index === 0) {
            const cardBack = revealControl.querySelector("img");
            cardBack.scrollIntoView({ block: "center" });
            await nextFrame();
            const bounds = cardBack.getBoundingClientRect();
            const hitTarget = document.elementFromPoint(
              bounds.left + bounds.width / 2,
              bounds.top + bounds.height / 2
            );
            assert(
              revealControl.contains(hitTarget),
              "Il dorso della carta è coperto da un altro controllo"
            );
            revealControl.setPointerCapture = function () {};
            cardBack.dispatchEvent(new PointerEvent("pointerdown", {
              bubbles: true,
              pointerId: 1,
              pointerType: "mouse",
              isPrimary: true
            }));
            await delay(760);
          } else {
            revealControl.focus();
            document.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          }
          await nextFrame();
          assert(app.textContent.includes("Sei "), `Ruolo ${index + 1} non rivelato`);
          if (app.textContent.includes("Sei Portavoce")) portavoceIndex = index;
          click("hide-role");
          await nextFrame();
        }
        assert(portavoceIndex >= 0, "Portavoce non assegnato");

        assert(app.textContent.includes("Il faro è pronto"), "Schermata pronta assente");
        window.__BLACKOUT_TEST_SPEECH__.failNext = true;
        click("start-night");
        await delay(60);
        assert(
          app.textContent.includes("Il faro è pronto"),
          "Il fallimento del preflight ha avviato la notte"
        );
        assert(
          app.querySelector(".inline-error")?.textContent.includes("non ha risposto"),
          "Errore del preflight non mostrato"
        );
        click("start-night");
        await delay(60);
        assert(app.textContent.includes("Notte 1"), "La partita non inizia dalla Notte 1");
        assert(app.textContent.includes("La luce si spegne"), "Schermata di chiusura occhi assente");
        assert(
          app.querySelector(".handoff-timer") &&
          !app.querySelector('[data-action="night-next"]'),
          "L'inizio della notte richiede ancora un comando manuale"
        );

        window.__BLACKOUT_TEST_SPEECH__.failNext = true;
        await delay(transitionWait);
        const privacyCover = document.getElementById("privacy-cover");
        const privacyButton = privacyCover.querySelector("button");
        assert(!privacyCover.hidden, "Cover non mostrata dopo errore della voce");
        assert(
          privacyCover.textContent.includes("Tutti aprano gli occhi"),
          "Istruzione pubblica di recupero assente"
        );
        privacyButton.click();
        assert(!privacyCover.hidden, "La cover ha rivelato subito la schermata segreta");
        assert(privacyButton.disabled, "Retry della voce non bloccato");
        window.dispatchEvent(new Event("blur"));
        assert(
          !privacyButton.disabled,
          "Perdita di focus durante il retry ha bloccato la cover"
        );
        window.dispatchEvent(new Event("focus"));
        privacyButton.click();
        await delay(60);
        assert(privacyCover.hidden, "Cover non rimossa dopo il retry riuscito");
        const retryTexts = window.__BLACKOUT_TEST_SPEECH__.spokenTexts.slice(-2);
        assert(
          retryTexts[0]?.includes("Tutti chiudano gli occhi"),
          "Reset collettivo degli occhi assente"
        );
        assert(
          retryTexts[1]?.includes("Sabotatori, aprite gli occhi"),
          "Chiamata del ruolo non ripetuta dopo il reset"
        );

        let sawGuastatoreHandoff = false;
        let sawAutomaticDawn = false;
        for (let guard = 0; guard < 30 && !app.textContent.includes("Alba del Giorno"); guard += 1) {
          if (app.querySelector('[data-action="night-next"]')) {
            click("night-next");
          } else if (app.querySelector('[data-action="sab-target-review"]')) {
            const target = app.querySelector(
              `input[name="night-sabotage-target"][value="p${portavoceIndex + 1}"]`
            );
            assert(target, "Nessun bersaglio notturno");
            target.checked = true;
            click("sab-target-review");
          } else if (app.querySelector('[data-action="sab-target-confirm"]')) {
            click("sab-target-confirm");
          } else if (app.querySelector('[data-action="binary-power"]')) {
            const skip = app.querySelector('[data-action="binary-power"][data-use="false"]');
            assert(skip, "Scelta salta potere assente");
            skip.click();
          } else if (app.querySelector('[data-action="investigator-skip"]')) {
            click("investigator-skip");
          } else if (app.querySelector(".handoff-timer")) {
            if (app.textContent.includes("Solo il Guastatore resta sveglio")) {
              sawGuastatoreHandoff = true;
            }
            if (app.textContent.includes("L'alba sorgerà automaticamente")) {
              sawAutomaticDawn = true;
              assert(
                !app.querySelector('[data-action="resolve-night"]'),
                "La risoluzione della notte richiede ancora un comando manuale"
              );
              await delay(transitionWait);
            } else {
              await delay(handoffWait);
            }
          } else {
            throw new Error(`Flusso notturno bloccato: ${app.textContent.slice(0, 120)}`);
          }
          await nextFrame();
        }

        assert(sawGuastatoreHandoff, "Passaggio pubblico al Guastatore assente");
        assert(sawAutomaticDawn, "Attesa automatica prima dell'alba assente");
        assert(app.textContent.includes("Alba del Giorno 1"), "Alba del Giorno 1 non raggiunta");
        click("dawn-continue");
        await nextFrame();
        assert(app.textContent.includes("ultima parola"), "Potere del Portavoce assente");

        const bonusTarget = app.querySelector('input[name="portavoce-target"]');
        assert(bonusTarget, "Nessun destinatario per il voto doppio");
        bonusTarget.checked = true;
        click("portavoce-designate");
        await nextFrame();

        assert(app.textContent.includes("Giorno 1"), "Giorno 1 non raggiunto");
        assert(app.textContent.includes("Voto doppio attivo"), "Voto doppio del Portavoce assente");
        assert(
          app.querySelector('input[name="day-target"]') &&
          !app.querySelector('[data-action="day-elimination"]'),
          "Il giorno non apre direttamente la scelta dell'eliminato"
        );
        const storedGame = JSON.parse(
          localStorage.getItem(window.__BLACKOUT_STORAGE_KEY__) || "null"
        );
        assert(
          storedGame?.doubleVote?.createdOnDay === 0,
          "Il voto doppio della prima notte non è stato salvato correttamente"
        );
        localStorage.setItem(window.__BLACKOUT_SMOKE_RELOAD_KEY__, "1");
        location.reload();
      }

      setTimeout(() => {
        run().catch((error) => {
          result.value = `FAIL: ${error.message}`;
          result.textContent = `FAIL: ${error.message}`;
          document.documentElement.dataset.testStatus = "fail";
          report(`FAIL: ${error.message}`);
        });
      }, 40);
    })();
  </script>
</body>
</html>
